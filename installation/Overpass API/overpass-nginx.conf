server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name overpass.example.com;  # Change to your domain or IP

    location /api/ {
        # Path to Overpass API cgi-bin directory
        # Adjust this path based on your $EXEC_DIR installation
        alias /srv/overpass/osm-3s_v0.7.62.8/cgi-bin/;
        
        gzip on;
        gzip_types application/json application/osm3s+xml text/xml;
        gzip_min_length 1000;
        
        # FastCGI socket (default fcgiwrap location)
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        
        # Increase timeouts for long-running queries
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;

        client_max_body_size 10G;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    include /etc/nginx/snippets/ssl-params.conf;
}
