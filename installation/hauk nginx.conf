server
{
  listen 80;
  listen [::]:80;
  server_name hauk.geovault.example.com;
  return 301 https://$server_name$request_uri;
}

server
{
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name hauk.geovault.example.com;

  # Optional: nginx-level request rate limiting as defense-in-depth in front of the
  # application's own ingest rate limit (1 point update/track/second, see
  # extensions/live_track/src/backend/ingress_views.py). Requires a `limit_req_zone`
  # directive in the http {} block, e.g.:
  #   limit_req_zone $binary_remote_addr zone=hauk:10m rate=10r/s;
  # limit_req zone=hauk burst=20 nodelay;

  # Rewrite so backend receives /api/extensions/live-track/... (extension base).
  location /
  {
    rewrite ^(.*)$ /api/extensions/live-track$1 break;
    proxy_pass http://127.0.0.1:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection $http_connection;
  }
}