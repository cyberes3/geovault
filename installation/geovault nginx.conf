server
{
  listen 80;
  listen [::]:80;
  server_name geovault.example.com;
  return 301 https://$server_name$request_uri;
}

server
{
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name geovault.example.com;

  # Largest accepted upload (e.g. bulk GPX/KML/imagery imports). Raise only if you
  # specifically need larger single-file uploads.
  client_max_body_size 1G;

  # Optional: nginx-level request rate limiting as defense-in-depth in front of the
  # application's own per-endpoint rate limits (geo_lib.security.rate_limit). Requires a
  # `limit_req_zone` directive in the http {} block, e.g.:
  #   limit_req_zone $binary_remote_addr zone=geovault:10m rate=10r/s;
  # limit_req zone=geovault burst=20 nodelay;

  location /
  {
    proxy_pass http://127.0.0.1:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    # Required for Django's SECURE_PROXY_SSL_HEADER (request.is_secure(), HSTS, secure
    # cookies) to correctly detect HTTPS -- see security.trust_x_forwarded_proto in
    # config.example.yaml.
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for accurate client IPs in logs, per-IP rate limiting, and geolocation
    # (geo_lib.utils.ip_utils.get_client_ip) -- without this, every request appears to
    # come from the proxy itself.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection $http_connection;

    # Websockets
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
