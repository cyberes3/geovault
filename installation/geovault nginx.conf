server
{
  listen 80;
  listen [::]:80;
  server_name geovault.example.com;
  return 301 https://$server_name$request_uri;
}

server
{
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name geovault.example.com;

  client_max_body_size 10G;

  location /
  {
    proxy_pass http://127.0.0.1:8000;

    proxy_set_header Host $host;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Scheme $scheme;

    # Websockets
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Hauk compatibility: proxy root to live-track extension so Hauk clients see
# https://hauk.geovault.example.com/api/create.php etc. Add ssl_certificate
# for this host (or use a wildcard *.geovault.example.com cert).
server
{
  listen 80;
  listen [::]:80;
  server_name hauk.geovault.example.com;
  return 301 https://$server_name$request_uri;
}

server
{
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name hauk.geovault.example.com;

  # Rewrite so backend receives /api/extensions/live-track/... (extension base).
  location /
  {
    rewrite ^(.*)$ /api/extensions/live-track$1 break;
    proxy_pass http://127.0.0.1:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection $http_connection;
  }
}
