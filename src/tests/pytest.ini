[pytest]
DJANGO_SETTINGS_MODULE = website.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .
addopts = 
    --reuse-db
    --ds=website.settings
    -v
    -p pytest_django_version_fix
    -m "not performance and not slow"
filterwarnings =
    ignore::DeprecationWarning:channels_redis
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Custom markers for test categorization
markers =
    performance: Performance and load tests (run with -m performance)
    slow: Slow-running tests that may take several seconds (run with -m slow)
    concurrent: Tests for concurrent operations and race conditions
    edge_case: Edge case and boundary condition tests
    error_recovery: Error recovery and transaction rollback tests

# To run performance tests: pytest -m performance
# To run slow tests: pytest -m slow
# To run all tests including performance: pytest -m ""
# To skip performance tests (default): pytest (or pytest -m "not performance")

