{% load i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% trans "Opening app" %}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 1.5rem; max-width: 28rem; margin: 0 auto; }
        .link { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.25rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 0.5rem; font-weight: 500; }
        .link:hover { background: #1d4ed8; }
        p { color: #374151; }
    </style>
</head>
<body>
    <p>{% trans "Opening the app…" %}</p>
    <p>{% trans "If the app didn't open," %} <a id="handoff-link" class="link" href="{{ redirect_url|escape }}" target="_blank" rel="noopener">{% trans "tap here to open in app" %}</a>.</p>
    <script>
        (function() {
            var url = "{{ redirect_url|escapejs }}";
            var link = document.getElementById('handoff-link');
            if (link) link.href = url;
            var opened = window.open(url, '_blank', 'noopener');
            if (!opened) window.location.href = url;
        })();
    </script>
</body>
</html>
