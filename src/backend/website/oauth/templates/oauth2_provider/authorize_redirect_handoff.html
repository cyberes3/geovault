{% extends "allauth/layouts/base.html" %}
{% load i18n %}

{% block head_title %}
    {% trans "Opening app" %}
{% endblock head_title %}

{% block content %}
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 sm:p-6 lg:p-8">
            <h1 class="text-xl font-bold text-gray-900 mb-4">
                {% trans "Opening the app…" %}
            </h1>
            <p class="text-sm text-gray-600">
                {% trans "If the app didn't open," %} <a id="handoff-link" class="font-medium text-blue-600 hover:text-blue-700" href="{{ redirect_url|escape }}" target="_blank" rel="noopener">{% trans "tap here to open in app" %}</a>.
            </p>
        </div>
    </div>
    <script>
        (function() {
            var url = "{{ redirect_url|escapejs }}";
            var link = document.getElementById('handoff-link');
            if (link) link.href = url;
            var opened = window.open(url, '_blank', 'noopener');
            if (!opened) window.location.href = url;
        })();
    </script>
{% endblock content %}
