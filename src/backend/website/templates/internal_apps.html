<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>More GeoVault Apps</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .quiet { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
    section { margin-bottom: 1.5rem; }
    section h2 { font-size: 1rem; margin-bottom: 0.5rem; }
    section h2 a { color: #2563eb; text-decoration: none; }
    section h2 a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.35rem 0.5rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 500; color: #374151; }
    a.dl { color: #2563eb; text-decoration: none; }
    a.dl:hover { text-decoration: underline; }
    .back { margin-top: 1.5rem; font-size: 0.875rem; }
    .back a { color: #2563eb; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>More apps that work with GeoVault</h1>
  <br>
{#  <p class="quiet">Links to additional applications.</p>#}
  {% for app in app_list %}
  <section>
    <h2><a href="{{ app.releases_page_url }}" target="_blank" rel="noopener noreferrer">{{ app.display_name }}</a></h2>
    <table>
      <tbody>
        {% for asset in app.assets %}
        <tr>
          <th>{{ asset.name }}</th>
          <td><a href="{{ asset.url }}" target="_blank" rel="noopener noreferrer" class="dl">Download</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
  {% empty %}
  <p class="quiet">No apps configured.</p>
  {% endfor %}
</body>
</html>
