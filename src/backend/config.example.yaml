# GeoVault Configuration File

site:
  # Site domain name (used in email links and Site framework)
  # This should match your actual domain
  domain: geovault.example.com

  # Site display name (used in email templates and Site framework)
  name: GeoVault


security:
  # Django secret key (REQUIRED - the server will refuse to start without a real value here).
  # Can be overridden with SECRET_KEY environment variable.
  # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(50))"
  secret_key: django-insecure-change-this-in-production

  # Debug mode for development (set to false in production)
  debug: false

  # When true (default: same as not debug), session/CSRF cookies use Secure (HTTPS only).
  # Set to false for plain-HTTP installs (e.g. http://server:8000) to avoid CSRF failures.
  # secure_cookies: true

  # Trust X-Forwarded-Proto from your reverse proxy (nginx: proxy_set_header X-Forwarded-Proto $scheme;).
  # Default: true when debug is false. Disable if Django is exposed directly to untrusted clients.
  # trust_x_forwarded_proto: true

  # Extra CSRF trusted origins (scheme+host[:port]) if the browser URL does not match site.domain
  # additional_csrf_trusted_origins:
  #   - http://192.168.1.10:8000

  # Additional hosts that can access the Django server
  # The primary host is always site.domain (see above).
  # Use this list for extra domains or reverse proxy IPs. For example, if
  # 192.168.1.88 is your internal reverse proxy:
  # additional_allowed_hosts:
  #   - 192.168.1.88

  # Additional CORS origins to allow (beyond the site domain and tile sources)
  # Format: https://example.com (no trailing slash)
  # The system automatically allows:
  #   - The site's own domain (from site.domain)
  #   - External tile source origins (e.g., https://tile.opentopomap.org)
  # Use this to add any additional origins your frontend might need
  # additional_cors_origins:
  #   - https://app.example.com
  #   - https://mobile.example.com


logging:
  # Log level for application logging
  # Valid values: critical, error, warning, info, debug
  # Default: info
  log_level: info


database:
  name: geovault
  user: geovault
  # Password can be overridden with DB_PASSWORD environment variable
  password: your-database-password
  host: 127.0.0.1
  port: 5432

  # Postgres connection pooling (psycopg 3 pool). Omit this whole section to disable pooling
  # (persistent connections are reused for 300s instead). Defaults sized for 3 workers
  # (3 x 30 = 90 connections, under PostgreSQL's default max_connections of 97).
  # pool:
  #   min_size: 2
  #   max_size: 30
  #   timeout: 60

  # Dedicated test database used by src/tests/run-tests.sh (--reuse-db keeps the database
  # between runs; conftest.py/prepare_test_db.py drop and recreate tables each run).
  # Only needed for running the backend test suite, not for a production deployment.
  # test:
  #   name: gv_tests
  #   user: gv_tests
  #   # Password can be overridden with TEST_DB_PASSWORD environment variable
  #   password: your-test-database-password
  #   host: 127.0.0.1
  #   port: 5432


redis:
  host: 127.0.0.1
  port: 6379


tilesources:
  # Directory where proxied tiles will be cached on disk
  # Relative paths are relative to backend directory
  cache_dir: data/tile-cache

  # Enable or disable tile caching
  cache_enabled: true

  # Number of days before cached tiles expire
  cache_expiry_days: 30

  # When true, proxy all OSM-related tile sources (OSM, OpenTopoMap, OpenHikingMap) through the server.
  # Good for when OSM blocks you.
  # proxy_osm: false

  # Source IDs to proxy through the server even though they aren't OSM-related (see proxy_osm
  # above for the OSM sources). Useful for sources that block direct browser requests.
  # proxy_sources:
  #   - opentopomap

  # Source IDs to hide from the website map's basemap selector.
  # hidden:
  #   - google-satellite-hybrid

  # Raster basemap source used to generate social preview images for shared map links.
  # Must be a registered raster xyz layer from /api/tiles/sources.
  social_preview_raster_source: osm


maptiler:
  # MapTiler API key for accessing MapTiler maps and 3D terrain tiles
  # Can be overridden with MAPTILER_API_KEY environment variable
  # Get your API key from https://www.maptiler.com/
  # Important: DO NOT use the default API key that your account comes with! Instead,
  # generate a new one and set the "Allowed HTTP Origins" to your domain or else someone can
  # steal your key.
  api_key:

  # Proxy MapTiler tiles through the server with caching
  # Helps conserve API usage for free plans by caching tiles locally
  # Default: false (tiles loaded directly from MapTiler)
  proxy_tiles: false

  # List of MapTiler map IDs to include as tile sources (and in the basemap selector).
  # Get map IDs from https://cloud.maptiler.com/maps/
  maps:
    - topo-v4 # General purpose topo map
    - outdoor-v4 # Topo map with trails highlighted
    - satellite
    - streets
    - hybrid-v4

  # Map IDs that are registered as tile sources but hidden from the basemap selector.
  # Used by external clients (e.g. Android apps).
  hidden_maps:
    - base-v4
    - openstreetmap-dark


# Google API services
google:
  # Instructions are available at `installation/Google APIs.md`
  geocoding:
    # Can be overridden with GOOGLE_API_KEY environment variable
    api_key:


# Place search backend
# Required: set to maptiler or google (no default)
# Must also configure the maptiler or google api section elsewhere in the config
geocoding_search_mode: maptiler


icons:
  # Enable or disable icon processing for KML/KMZ files
  processing_enabled: true

  # Directory where processed icons will be stored
  # Relative paths are relative to backend directory
  storage_dir: data/icons

  # Timeout for fetching remote icons in seconds
  fetch_timeout: 5

  # Maximum size for icons extracted from KML/KMZ imports or fetched from a remote URL (1MB)
  max_size_bytes: 1048576

  # Maximum size for user-uploaded icons (500KB)
  upload_max_size_bytes: 512000

  # Allowed extensions for icon uploads (WEBP is converted to PNG on upload)
  upload_allowed_extensions:
    - .png
    - .jpg
    - .jpeg
    - .webp


reverse_geocoding:
  # Enable or disable reverse geocoding
  enabled: true

  # Distance thresholds for proximity tags (in miles)
  city_proximity_miles: 5.0
  lake_proximity_miles: 1.0

  # Areas server (admin, protected areas, lakes, ocean). Required when reverse geocoding is enabled.
  areas_server:
    api_url: http://127.0.0.1:5001
    request_timeout_seconds: 10
    verify_ssl: true
    # Max points per query batch (default 100; must not exceed areas server AREAS_SERVER_MAX_BATCH_SIZE).
    max_batch_size: 100
    # Search radius in miles for nearest place (city/town/village) when admin has no city (default 3; 0 to disable).
    city_radius_miles: 3.0

  # Number of points to sample along linestrings/multilinestrings for reverse geocoding. Points are equally spaced by distance along the track. Final tags are deduplicated per feature.
  linestring_geocode_points: 4


elevation:
  # API used to fill missing elevation data on imported features
  api_url: https://elevation.racemap.com/api

  # Enable or disable elevation lookups
  enabled: true

  # Request timeout in seconds
  timeout_seconds: 30


processing:
  # Number of threads to use for parallel feature processing during import
  import_threads: 10

  # Base timeout for file processing
  timeout_base_seconds: 30

  # Additional timeout per MB of file size
  timeout_per_mb_seconds: 2

  # Defense-in-depth ceiling for an entire import job (not just conversion), as a multiplier
  # on the per-conversion timeout above (timeout_base_seconds + timeout_per_mb_seconds * size).
  # Backstops every pipeline stage (splitting, elevation, tagging, DB write).
  timeout_job_ceiling_multiplier: 6

  # Batch size for duplicate detection
  duplicate_detection_batch_size: 100

  # Threshold for using batched approach
  duplicate_detection_batch_threshold: 1000

  # Batch size for bulk database operations
  bulk_create_batch_size: 1000

  # Interval for cleaning up old jobs (1 hour)
  job_cleanup_interval_seconds: 3600

  # Maximum age before jobs are cleaned up (2 hours)
  max_job_age_seconds: 7200

  # Show detailed error messages in import process logs (includes exception type and message)
  show_detailed_error_messages: true


# Celery broker/backend and task behavior. This entire section is optional: omit it (or any
# key within it) to use the defaults below. broker_url/result_backend default to Redis DBs 3
# and 4 on the `redis` host/port configured above.
celery:
  # Can be overridden with the CELERY_BROKER_URL environment variable.
  # broker_url: redis://127.0.0.1:6379/3

  # Can be overridden with the CELERY_RESULT_BACKEND environment variable.
  # result_backend: redis://127.0.0.1:6379/4

  # Default Celery queue name for tasks that don't specify one explicitly.
  default_queue: default

  # Run tasks synchronously in-process instead of dispatching to a worker (used by the test
  # suite; see src/tests/run-tests.sh). Can be overridden with CELERY_TASK_ALWAYS_EAGER.
  task_always_eager: false

  # When task_always_eager is true, propagate task exceptions to the caller instead of
  # swallowing them into the (unused, in-process) result backend.
  task_eager_propagates: true

  # How long to wait for a worker to respond to a health-check ping before considering it down.
  worker_startup_timeout_seconds: 5

  # Maximum age (seconds) of the celery-beat heartbeat before it's considered stale.
  beat_heartbeat_max_age_seconds: 20

  # How long to wait for a fresh beat heartbeat at startup before failing the check.
  beat_startup_wait_seconds: 10


maxmind:
  # Path to MaxMind GeoIP2 database file
  database_path: /var/lib/GeoIP/GeoLite2-City.mmdb


email:
  smtp:
    # SMTP server host
    host: smtp.gmail.com

    # SMTP server port (587 for TLS, 465 for SSL, 25 for unencrypted)
    port: 587

    # Use TLS encryption
    use_tls: true

    # Use SSL encryption (typically on port 465)
    use_ssl: false

    # SMTP username (usually your email address)
    username: your-email@gmail.com

    # SMTP password (can be overridden with EMAIL_HOST_PASSWORD environment variable)
    password: your-password

  # Email sender configuration
  from_email: noreply@example.com

  # Default "from" name
  from_name: GeoVault

  # Subject prefix for emails
  subject_prefix: "[GeoVault] "

# Configure individual extensions.
# The key must match the extension 'name' defined in its manifest.py
# By default, discovered extensions are enabled.
extensions:
  example_extension:
    enabled: false
    setting_one: "demo_value"
    setting_two: 42
    api_endpoint: "https://api.example.com"

  caltopo:
    enabled: true

  pwa_mint:
    # A self-hosted way to mint WebAPKs for the site without Google's services.
    # Useful for GrapheneOS users.
    enabled: false
    # URL of the self-hosted pwabuilder-google-play container.
    # If running in Docker, use the service name (e.g., http://pwabuilder:5858)
    # Can be overridden with the PWA_BUILDER_URL environment variable.
    pwa_builder_url: "http://pwabuilder:5858"

  live_track:
    # Location tracking server for devices to publish live location tracks to.
    enabled: true
    # Maximum geometry payload size per tracker in bytes (newest points retained when trimmed).
    # Applies to GET trackers/<id>/geometry/ (when all=true is not set) and POST trackers/geometry/.
    # Set to 1048576 (1 MB) by default.
    geometry_max_response_bytes: 1048576
    # Domain used for the Hauk-compatible API (e.g. hauk.geovault.example.com).
    # Configure your reverse proxy to route this host to the live_track extension root so the app sees /api/create.php etc.
    # Instructions are in the installation docs.
    # hauk_domain: hauk.geovault.example.com
