# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Release signing configuration
# Only the keystore path and alias are stored here
# Passwords will be prompted when building release APKs
# Create a keystore with: keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload
RELEASE_STORE_FILE=keystore.jks
RELEASE_KEY_ALIAS=upload

