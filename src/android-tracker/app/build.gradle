// Helper function to get git commit hash (non-blocking)
def getGitCommitHash() {
    if (!project.hasProperty('gitCommitHash')) {
        try {
            def rootDir = project.rootProject.projectDir.parentFile
            def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
            def output = new ByteArrayOutputStream()
            def error = new ByteArrayOutputStream()
            process.consumeProcessOutput(output, error)
            
            def completed = false
            Thread.start {
                process.waitFor()
                completed = true
            }
            
            for (int i = 0; i < 10 && !completed; i++) {
                Thread.sleep(100)
            }
            
            if (completed && process.exitValue() == 0) {
                project.ext.gitCommitHash = output.toString().trim()
            } else {
                if (!completed) process.destroy()
                project.ext.gitCommitHash = 'unknown'
            }
        } catch (Exception e) {
            project.ext.gitCommitHash = 'unknown'
        }
    }
    return project.ext.gitCommitHash ?: 'unknown'
}

// Helper function to get git commit date (non-blocking)
def getGitCommitDate() {
    if (!project.hasProperty('gitCommitDate')) {
        try {
            def rootDir = project.rootProject.projectDir.parentFile
            def process = ['git', 'log', '-1', '--format=%cd', '--date=short'].execute(null, rootDir)
            def output = new ByteArrayOutputStream()
            def error = new ByteArrayOutputStream()
            process.consumeProcessOutput(output, error)
            
            def completed = false
            Thread.start {
                process.waitFor()
                completed = true
            }
            
            for (int i = 0; i < 10 && !completed; i++) {
                Thread.sleep(100)
            }
            
            if (completed && process.exitValue() == 0) {
                project.ext.gitCommitDate = output.toString().trim()
            } else {
                if (!completed) process.destroy()
                project.ext.gitCommitDate = new Date().format('yyyy-MM-dd')
            }
        } catch (Exception e) {
            project.ext.gitCommitDate = new Date().format('yyyy-MM-dd')
        }
    }
    return project.ext.gitCommitDate ?: new Date().format('yyyy-MM-dd')
}

android {
    namespace = 'com.geovault.tracker'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.geovault.tracker"
        minSdk = 34
        targetSdk = 36
        versionName = "${getGitCommitDate()}-${getGitCommitHash()}"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            def storeFileProp = project.findProperty('RELEASE_STORE_FILE') ?: 'keystore.jks'
            def keyAliasProp = project.findProperty('RELEASE_KEY_ALIAS') ?: 'upload'
            
            storeFile = file(storeFileProp)
            keyAlias = keyAliasProp
            
            def storePwd = project.findProperty('RELEASE_STORE_PASSWORD')
            def keyPwd = project.findProperty('RELEASE_KEY_PASSWORD')
            
            if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                if (!storePwd) throw new GradleException('RELEASE_STORE_PASSWORD not provided.')
                if (!keyPwd) throw new GradleException('RELEASE_KEY_PASSWORD not provided.')
            }
            
            if (storePwd) storePassword = storePwd
            if (keyPwd) keyPassword = keyPwd
        }
    }
    
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled = !project.hasProperty('SKIP_MINIFY')
            shrinkResources = !project.hasProperty('SKIP_MINIFY')
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.release
            debuggable = false
        }
    }
    
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}


dependencies {
    implementation project(':android-common')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
